<div class="login-page login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="logo-circle">
        <mat-icon color="primary">lock</mat-icon>
      </div>
      <mat-card-title>Welcome to Admin Dashboard</mat-card-title>
      <mat-card-subtitle>Please sign in to continue</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email" type="email" placeholder="user@example.com">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'">
          <mat-icon matPrefix>key</mat-icon>
          <button mat-icon-button matSuffix (click)="hidePassword.set(!hidePassword())" type="button">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button color="primary" class="login-btn" [disabled]="loginForm.invalid">
          Sign In
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
