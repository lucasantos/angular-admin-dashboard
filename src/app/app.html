<mat-toolbar class="toolbar-container">
    <div class="toolbar-left">
        <button mat-icon-button (click)="collapsed.set(!collapsed())"
          [matTooltip]="!collapsed() ? 'Collapse menu' : 'Expand menu'"
          matTooltipPosition="below">
            <mat-icon>menu</mat-icon>
        </button>

        <a routerLink="/" class="logo">
          <img [src]="logo" alt="Logo" class="logo">
        </a>

        <span>{{ title() }}</span>
    </div>

    <app-search class="toolbar-center" />

    <app-tools class="toolbar-right" />
</mat-toolbar>

<mat-sidenav-container>
    <mat-sidenav mode="side" opened [style.width]="sidenavWidth()">
        <app-custom-sidenav [collapsed]="collapsed()" [menuItems]="menuItems" />
    </mat-sidenav>
    <mat-sidenav-content class="content" [style.margin-left]="sidenavWidth()">
        <app-breadcrumb></app-breadcrumb>
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
