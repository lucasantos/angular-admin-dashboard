<!-- Translation Button with flag icons for English, Spanish and Brazilian Portuguese -->
<button mat-icon-button [matMenuTriggerFor]="translationMenu" matTooltip="Switch language"
  aria-label="Translation menu">
  <mat-icon>language</mat-icon>
</button>

<mat-menu #translationMenu="matMenu" class="language-menu">
  @for (lang of langService.languages; track lang.code) {
  <button mat-menu-item class="language-selector-item" (click)="changeLanguage(lang.code)">
    <span class="flag" [class]="lang.flagClass" [title]="lang.label"></span>
    <span [class.active-lang]="langService.currentLanguage() === lang.code">
      {{ lang.label }}
    </span>
    @if (langService.currentLanguage() === lang.code) {
    <mat-icon class="check-icon">check</mat-icon>
    }
  </button>
  }
</mat-menu>
