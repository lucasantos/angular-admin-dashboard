<h2 mat-dialog-title class="dialog-header">
  <mat-icon color="primary">chat_bubble_outline</mat-icon>
  {{ data.title }}
</h2>
<mat-dialog-content class="dialog-content">
  <p class="time-stamp mat-body-small">
    {{ data.timestamp | date: "medium" }}
  </p>
  <div class="message-body" [innerHTML]="data.message"></div>

  @if (data.type === "warning") {
  <div class="alert-box">
    <mat-icon>report_problem</mat-icon>
    <span>Action required: Please check your support ticket for
      updates.</span>
  </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close('cancel')">Close</button>
  <button mat-flat-button color="primary" [mat-dialog-close]="'view_ticket'">
    Go to Ticket
  </button>
</mat-dialog-actions>
