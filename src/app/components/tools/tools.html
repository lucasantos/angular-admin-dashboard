<!-- For all buttons with icons, the default font is material-icons-outlined, when the user hovers the mouse over them, the font should be material-icons. -->
<app-theme-selector />

<app-language-selector />

<app-help-menu />

<app-notification-center />

<!-- Profile Button -->
<button mat-icon-button [matMenuTriggerFor]="profileMenu" matTooltip="Account menu" aria-label="Account menu">
  <mat-icon>account_circle</mat-icon>
</button>

<mat-menu #profileMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>person</mat-icon>
    <span>My Profile</span>
  </button>
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  <button mat-menu-item>
    <mat-icon>feedback</mat-icon>
    <span>Feedback</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item>
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
