<div class="sidenav-header">
  <img [width]="profilePicSize()" [height]="profilePicSize()" src="/assets/images/profile-pic.png" alt="Profile" class="profile-image">
  <div class="header-text" [class.hide-header-text]="sideNavCollapsed()">
    <h2>John Doe</h2>
    <p>IT Director</p>
  </div>
</div>

<mat-nav-list>
  @for (item of menuItems(); track item) {
    <a
      mat-list-item
      class="menu-item"
      [routerLink]="item.route"
      routerLinkActive="selected-menu-item"
      #rla="routerLinkActive"
      [activated]="rla.isActive"
      [title]="!sideNavCollapsed() ? item.label : ''"
      [matTooltip]="sideNavCollapsed() ? item.label : ''"
      matTooltipPosition="right"
    >
      <mat-icon [fontSet]="rla.isActive ? 'material-icons' : 'material-icons-outlined'" matListItemIcon>
        {{ item.icon }}
      </mat-icon>

      @if (!sideNavCollapsed()) {
        <span matListItemTitle>{{ item.label }}</span>
      }
    </a>
  } @empty {
    <!-- This block is displayed when no menu items are available.
     It's important when you have dynamic menu items because a message can be displayed to the user. -->
    <a mat-list-item title="No menu items found!">
        <mat-icon matListItemIcon>block</mat-icon>
        <span matListItemTitle>No menu items found!</span>
    </a>
  }
</mat-nav-list>
