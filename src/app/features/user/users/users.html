<div class="page-header">
  <h1>User Management</h1>
  <button mat-flat-button color="primary">
    <mat-icon>add</mat-icon> CREATE USER
  </button>
</div>

<div class="table-container mat-elevation-z2">
  <table mat-table [dataSource]="users()">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user"><strong>{{ user.name }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        <mat-chip-set>
          <mat-chip class="role-chip">{{ user.role }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let user">
        <span class="status-dot" [class]="user.status.toLowerCase()"></span>
        {{ user.status }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let user">
        <a mat-icon-button [routerLink]="['/users/user', user.id]" matTooltip="View Details">
          <mat-icon color="primary">visibility</mat-icon>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="5">No users found.</td>
    </tr>
  </table>
</div>
