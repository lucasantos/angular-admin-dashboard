<div class="login-page login-container" *transloco="let t; prefix: 'auth.login'">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="logo-circle">
        <mat-icon color="primary">lock</mat-icon>
      </div>
      <mat-card-title>{{ t('title') }}</mat-card-title>
      <mat-card-subtitle>{{ t('subtitle') }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ t('email') }}</mat-label>
          <input matInput formControlName="email" type="email" [placeholder]="t('emailPlaceholder')">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ t('password') }}</mat-label>
          <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'">
          <mat-icon matPrefix>key</mat-icon>
          <button mat-icon-button matSuffix (click)="hidePassword.set(!hidePassword())" type="button">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button color="primary" class="login-btn" [disabled]="loginForm.invalid || isLoading()" type="submit">
          @if (isLoading()) {
          <mat-spinner diameter="20" style="margin-right: 8px;"></mat-spinner>
          }
          {{ isLoading() ? t('authenticating') : t('signIn') }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
